name: DJ Engine Next Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/example/data/dj/next/**"
      - "app/src/test/java/com/example/data/dj/next/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
  push:
    branches: [feature/maxmize-dj-engine-next]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run app unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
