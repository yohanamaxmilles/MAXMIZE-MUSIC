name: DJ Engine Next Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/example/data/dj/next/**"
      - "app/src/main/java/com/example/player/**"
      - "app/src/test/java/com/example/data/dj/next/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/dj-engine-next.yml"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: dj-engine-next-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install and configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"
      - name: Run app unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
